name: Shopping Cart CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Runs 4 tests -> 3 Pass, 1 Fails (Shows Red X in GitHub Actions)
  test-3-pass-1-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Run JUnit 5 Tests (3 Pass, 1 Fail)
        env:
          FAIL_ONE_TEST: "true"
        run: mvn clean test

  # Job 2: Runs 4 tests -> All 4 Pass (Shows Green Checkmark in GitHub Actions)
  test-all-4-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Run JUnit 5 Tests (All 4 Pass)
        run: mvn clean test

  # Job 3: Builds and pushes Docker image after Job 2 passes
  build-and-push-docker:
    needs: test-all-4-pass
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-cart-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-cart-app:${{ github.sha }}